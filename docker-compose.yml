# Molde do kit — copiar para docker-compose.yml na RAIZ do repo.
# Ambiente local do desenvolvedor: sobe banco (+ mailpit + redis) e o dev roda
# backend e frontend na maquina, com hot reload.
#
#   docker compose up -d
#   cd backend && mvn spring-boot:run -Dspring-boot.run.profiles=dev
#   cd frontend && npm start
services:

  db:
    image: mysql:8.0
    restart: unless-stopped
    # Porta 3310 por padrao para evitar conflito com MySQL local (3306)
    # Se quiser usar 3306 mesmo: DB_PORT_HOST=3306 docker compose up -d
    ports:
      - "${DB_PORT_HOST:-3310}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: transportmanager
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev
      TZ: America/Sao_Paulo
    volumes:
      - db_data_dev:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      retries: 10

  # Captura todo e-mail enviado em dev — convite, reset de senha, dunning.
  # UI em http://localhost:8025 . Nunca configure SMTP real no profile dev.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"   # interface web
      - "1025:1025"   # SMTP

  # redis:
  #   image: redis:7-alpine
  #   ports: ["6379:6379"]

volumes:
  db_data_dev:
