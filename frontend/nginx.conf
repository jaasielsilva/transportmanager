# Nginx DE DENTRO da imagem do frontend — molde do kit.
# Copiar para frontend/nginx.conf.
#
# Peca obrigatoria da arquitetura: no compose de producao o backend NAO expoe
# porta. Quem recebe a requisicao do Nginx da VPS e este container, que serve o
# Angular e faz proxy de /api e /actuator para backend:8080 pela rede interna.
# Sem este arquivo o deploy sobe e responde 404 em toda chamada de API.

upstream backend {
    server backend:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preservado pelo Nginx da VPS — o backend precisa disto para montar
        # links absolutos (e-mail de convite, reset de senha) com https.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Somente as metricas; o Nginx da VPS ja restringe ao IP do monitoring.
    location = /actuator/prometheus {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # Health interno para o healthcheck do compose e o smoke test do CI.
    location = /actuator/health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # Assets com hash no nome podem ser cacheados para sempre.
    location ~* \.(js|css|woff2|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca em cache — senao o cliente fica preso numa versao antiga
    # do app apontando para assets que ja nao existem.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback: rota do Angular nao e arquivo no disco.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
