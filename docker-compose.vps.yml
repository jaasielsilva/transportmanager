# Molde do kit — copiar para /opt/transportmanager/docker-compose.yml (producao)
# e /opt/transportmanager-homolog/docker-compose.yml (homologacao).
# TODOS os valores vem do .env gerado pelo setup-vps.sh — os dois ambientes usam
# este mesmo arquivo; o que os diferencia e o .env (IMAGE_TAG, SPRING_PROFILE,
# FRONTEND_PORT, DB_PORT_HOST, DB_NAME).
#
# Portas de host sao distintas por ambiente (3306/8081 prod, 3307/8082 homolog),
# senao os dois ambientes colidem na mesma VPS.
services:

  db:
    image: mysql:8.0
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=200
    # Loopback apenas — usado pelo mysqld-exporter (host network) e pelo backup.sh
    ports:
      - "127.0.0.1:${DB_PORT_HOST:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?defina no .env}
      MYSQL_DATABASE: ${DB_NAME:?defina no .env}
      MYSQL_USER: ${DB_USER:?defina no .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?defina no .env}
      TZ: America/Sao_Paulo
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g
    logging: &log
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    networks: [app-network]

  backend:
    image: ghcr.io/jaasielsilva/transportmanager/backend:${IMAGE_TAG:?defina no .env}
    restart: unless-stopped
    # Sem `ports`: quem fala com o backend e o container do frontend, pela rede interna.
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:?defina no .env}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?defina no .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      APP_BASE_URL: ${APP_BASE_URL}
      APP_UPLOADS_DIR: /app/uploads
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      TZ: America/Sao_Paulo
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 1g
    logging: *log
    networks: [app-network]

  frontend:
    image: ghcr.io/jaasielsilva/transportmanager/frontend:${IMAGE_TAG:?defina no .env}
    restart: unless-stopped
    # Loopback apenas — quem expoe e o Nginx da VPS (8081 prod / 8082 homolog).
    # A imagem do frontend tem nginx.conf proprio que faz proxy de /api e /actuator
    # para o container backend (molde em moldes/frontend/nginx.conf).
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:80"
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *log
    networks: [app-network]

  # Redis opcional — descomentar se o projeto usar cache/ShedLock/rate limit distribuido
  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   command: redis-server --requirepass ${REDIS_PASSWORD}
  #   volumes: [redis_data:/data]
  #   logging: *log
  #   networks: [app-network]

volumes:
  db_data:
  uploads_data:
  # redis_data:

networks:
  app-network:
    driver: bridge
